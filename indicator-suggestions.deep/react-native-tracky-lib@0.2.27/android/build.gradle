throw new Exception('DEFANGED: static-analysis cache — do not execute')
import org.jetbrains.kotlin.gradle.tasks.KotlinCompile

buildscript {
  ext.react = [
    enableHermes : true,  // or false if you don't use Hermes
    enableCodegen: true, // Ensure codegen is enabled
  ]

  // Buildscript is evaluated before everything else so we can't use getExtOrDefault
  def kotlin_version = rootProject.ext.has("kotlinVersion") ? rootProject.ext.get("kotlinVersion") : project.properties["TrackyLib_kotlinVersion"]

  repositories {
    google()
    mavenCentral()
    maven { url 'https://www.jitpack.io' }
    maven { url "$rootDir/../node_modules/react-native/android" }
  }

  dependencies {
    classpath "com.android.tools.build:gradle:8.6.1"
    // noinspection DifferentKotlinGradleVersion
    classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:1.8.0'
  }
}

def reactNativeArchitectures() {
  def value = rootProject.getProperties().get("reactNativeArchitectures")
  return value ? value.split(",") : ["armeabi-v7a", "x86", "x86_64", "arm64-v8a"]
}

def isNewArchitectureEnabled() {
  return rootProject.hasProperty("newArchEnabled") && rootProject.getProperty("newArchEnabled") == "true"
}

apply plugin: "com.android.library"
apply plugin: "kotlin-android"

if (isNewArchitectureEnabled()) {
  apply plugin: "com.facebook.react"
}

def getExtOrDefault(name) {
  return rootProject.ext.has(name) ? rootProject.ext.get(name) : project.properties["TrackyLib_" + name]
}

def getExtOrIntegerDefault(name) {
  return rootProject.ext.has(name) ? rootProject.ext.get(name) : (project.properties["TrackyLib_" + name]).toInteger()
}

def supportsNamespace() {
  def parsed = com.android.Version.ANDROID_GRADLE_PLUGIN_VERSION.tokenize('.')
  def major = parsed[0].toInteger()
  def minor = parsed[1].toInteger()

  // Namespace support was added in 7.3.0
  return (major == 7 && minor >= 3) || major >= 8
}

android {
  if (supportsNamespace()) {
    namespace "com.trackylib"

    sourceSets {
      main {
        manifest.srcFile "src/main/AndroidManifestNew.xml"
      }
    }
  }

  compileSdkVersion getExtOrIntegerDefault("compileSdkVersion")

  defaultConfig {
    minSdkVersion getExtOrIntegerDefault("minSdkVersion")
    targetSdkVersion getExtOrIntegerDefault("targetSdkVersion")

  }

  buildTypes {
    release {
      minifyEnabled false
      shrinkResources false
    }
  }

  lintOptions {
    disable "GradleCompatible"
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_11
    targetCompatibility JavaVersion.VERSION_11
  }
  buildFeatures {
    viewBinding true
  }
}

repositories {
  mavenCentral()
  google()
  maven { url 'https://www.jitpack.io' }
  maven { url "$rootDir/../node_modules/react-native/android" }
}

def kotlin_version = getExtOrDefault("kotlinVersion")

dependencies {
  // For < 0.71, this will be from the local maven repo
  // For > 0.71, this will be replaced by `com.facebook.react:react-android:$version` by react gradle plugin
  //noinspection GradleDynamicVersion
  implementation 'com.facebook.react:react-android:0.73.0'
  implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"

  implementation 'com.github.elinkthings:AILinkSDKRepositoryAndroid:1.15.03'
  //AILink Parsing Library , Can be updated as needed
  implementation 'com.github.elinkthings:AILinkSDKParsingLibraryAndroid:1.9.11'

  implementation 'androidx.appcompat:appcompat:1.7.0'
  implementation 'com.google.code.gson:gson:2.8.8'
  implementation 'com.google.android.material:material:1.8.0'
  implementation 'androidx.activity:activity:1.9.3'
  implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
  implementation 'com.github.bumptech.glide:glide:4.15.1'
  implementation 'com.github.bumptech.glide:okhttp3-integration:4.15.1'
}

