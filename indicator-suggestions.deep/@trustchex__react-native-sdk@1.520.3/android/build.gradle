buildscript {
  ext.getExtOrDefault = {name ->
    return rootProject.ext.has(name) ? rootProject.ext.get(name) : project.properties['TrustchexSDK_' + name]
  }

  repositories {
    google()
    mavenCentral()
  }

  dependencies {
    classpath "com.android.tools.build:gradle:8.7.2"
    // noinspection DifferentKotlinGradleVersion
    classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:${getExtOrDefault('kotlinVersion')}"
  }
}


apply plugin: "com.android.library"
apply plugin: "kotlin-android"

apply plugin: "com.facebook.react"

def getExtOrIntegerDefault(name) {
  return rootProject.ext.has(name) ? rootProject.ext.get(name) : (project.properties["TrustchexSDK_" + name]).toInteger()
}

android {
  namespace "com.trustchex.reactnativesdk"

  compileSdkVersion getExtOrIntegerDefault("compileSdkVersion")

  defaultConfig {
    minSdkVersion getExtOrIntegerDefault("minSdkVersion")
    targetSdkVersion getExtOrIntegerDefault("targetSdkVersion")
  }

  buildFeatures {
    buildConfig true
  }

  buildTypes {
    release {
      minifyEnabled false
    }
  }

  lintOptions {
    disable "GradleCompatible"
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_1_8
    targetCompatibility JavaVersion.VERSION_1_8
  }

  sourceSets {
    main {
      java.srcDirs += [
        "generated/java",
        "generated/jni"
      ]
    }
  }
}

repositories {
  mavenCentral()
  google()
}

def kotlin_version = getExtOrDefault("kotlinVersion")

dependencies {
  implementation "com.facebook.react:react-android"
  implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"

  // CameraX dependencies
  implementation "androidx.camera:camera-core:1.4.0"
  implementation "androidx.camera:camera-camera2:1.4.0"
  implementation "androidx.camera:camera-lifecycle:1.4.0"
  implementation "androidx.camera:camera-view:1.4.0"
  implementation "androidx.camera:camera-video:1.4.0"

  // Google ML Kit dependencies
  implementation 'com.google.mlkit:text-recognition:16.0.1'
  implementation 'com.google.mlkit:face-detection:16.1.7'
  implementation 'com.google.mlkit:barcode-scanning:17.3.0'

  // Google Play Services dependency for Tasks
  implementation 'com.google.android.gms:play-services-tasks:18.2.0'

  // OpenCV for hologram detection and image processing
  implementation 'org.opencv:opencv:4.12.0'

  // Pure-Java JPEG2000 decoder (jj2000, edu.ucar 5.2) — vendored as a local jar
  // so it resolves fully offline with no Maven coordinate. Android's image
  // pipeline cannot decode JPEG2000, but passport chip portraits (DG2) are
  // frequently JP2; this lets ImageDecoderModule decode them to JPEG for display.
  // No java.awt / javax.imageio usage, so it runs on Android.
  implementation files("libs/jj2000-5.2.jar")

  // Plain-JVM unit tests for the framework-free JP2 decode logic (Jp2PgxDecoder).
  testImplementation "junit:junit:4.13.2"
}

react {
  jsRootDir = file("../src/")
  libraryName = "TrustchexSDK"
  codegenJavaPackageName = "com.trustchex.reactnativesdk"
}
