repositories {
//   maven { url "https://tencent-tds-maven.pkg.coding.net/repository/shiply/repo" }
  maven { url "https://maven.cnb.cool/tencent-tds/shiply-public/-/packages/" }
  mavenCentral()
  google()
}

def kotlin_version = getExtOrDefault("kotlinVersion")
def reshub_version = '1.8.23-RC01'
dependencies {
//   implementation "com.facebook.react:react-android"
  implementation 'com.facebook.react:react-native:+'
  implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"
  // 1.8.22-RC01
  implementation "com.tencent.shiply:reshub-sdk:$reshub_version"       // ResHub核心SDK
  implementation "com.tencent.shiply:reshub-net:$reshub_version"       // 可选，默认网络下载实现
  implementation "com.tencent.shiply:reshub-report:$reshub_version"    // 可选，默认上报SDK
  implementation "com.tencent.shiply:reshub-patch-sdk:$reshub_version" // 可选，差量更新SDK

}

if (isNewArchitectureEnabled()) {
  react {
    jsRootDir = file("../src/")
    libraryName = "ShiplyReactNativeUpgrade"
    codegenJavaPackageName = "com.rnshiplyupgrade"
  }
}

