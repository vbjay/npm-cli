throw new Exception('DEFANGED: static-analysis cache — do not execute')
buildscript {
  ext.getExtOrDefault = {name ->
    return rootProject.ext.has(name) ? rootProject.ext.get(name) : project.properties['TappSdk_' + name]
  }

  repositories {
    google()
    mavenCentral()
  }

  dependencies {
    classpath "com.android.tools.build:gradle:8.7.2"
    // noinspection DifferentKotlinGradleVersion
    classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:${getExtOrDefault('kotlinVersion')}"
  }
}


apply plugin: "com.android.library"
apply plugin: "kotlin-android"

apply plugin: "com.facebook.react"

def getExtOrIntegerDefault(name) {
  return rootProject.ext.has(name) ? rootProject.ext.get(name) : (project.properties["TappSdk_" + name]).toInteger()
}

def widgetID = project.findProperty("widgetID") ?: ""
def widgetKey = project.findProperty("widgetKey") ?: ""

android {
  namespace "com.tappsdk"

configurations.all {
    resolutionStrategy {
        force "org.jetbrains.kotlinx:kotlinx-serialization-json:1.6.0"
    }
}

  compileSdkVersion getExtOrIntegerDefault("compileSdkVersion")

  defaultConfig {
    minSdkVersion getExtOrIntegerDefault("minSdkVersion")
    targetSdkVersion getExtOrIntegerDefault("targetSdkVersion")

    buildConfigField "String", "WIDGET_ID", "\"${widgetID}\""
    buildConfigField "String", "WIDGET_KEY", "\"${widgetKey}\""

  }

  buildFeatures {
    buildConfig true
  }

  buildTypes {
    release {
      minifyEnabled false
    }
  }

  lintOptions {
    disable "GradleCompatible"
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_1_8
    targetCompatibility JavaVersion.VERSION_1_8
  }

  sourceSets {
    main {
      java.srcDirs += [
        "generated/java",
        "generated/jni"
      ]
    }
  }
}

repositories {
  mavenCentral()
  google()
}

def kotlin_version = getExtOrDefault("kotlinVersion")

dependencies {
  implementation "com.facebook.react:react-android"
  implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"
  implementation files("$projectDir/libs/TappSdk.aar") 

  implementation "com.squareup.okhttp3:okhttp:5.1.0"
  implementation "org.jetbrains.kotlinx:kotlinx-serialization-cbor:1.9.0"
  implementation "androidx.work:work-runtime:2.11.0"
  implementation "androidx.work:work-runtime-ktx:2.11.0"
  implementation "org.jetbrains.kotlinx:kotlinx-serialization-json:1.9.0"
  implementation "org.jetbrains.kotlin:kotlin-reflect:$kotlin_version"
  implementation "androidx.glance:glance-appwidget:1.2.0-beta01"
  implementation "androidx.glance:glance:1.2.0-beta01"
  implementation "androidx.compose.runtime:runtime:1.6.0"
}
