apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'
apply plugin: 'expo-module-gradle-plugin'

android {
  namespace "expo.modules.mediapipe"

  compileSdk = 35

  defaultConfig {
    minSdk = 24
    targetSdk = 35
    versionCode 1
    versionName "0.1.0"
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }

  kotlinOptions {
    jvmTarget = "17"
  }

  // JSI fast path — C++ compiled against React Native's prefab-exported jsi
  buildFeatures {
    prefab true
  }

  externalNativeBuild {
    cmake {
      path "CMakeLists.txt"
    }
  }

  defaultConfig.externalNativeBuild.cmake {
    cppFlags "-std=c++20", "-fexceptions", "-frtti"
    // React Native's prefab libraries require the shared C++ runtime
    arguments "-DANDROID_STL=c++_shared"
  }
}

repositories {
  google()
  mavenCentral()
}

dependencies {
  // React Native — implementation (not compileOnly) so its prefab-exported
  // native modules (jsi) are visible to our CMake build
  implementation 'com.facebook.react:react-android'

  // Bundled MediaPipe Tasks Vision SDK
  implementation 'com.google.mediapipe:tasks-vision:0.10.+'

  // CameraX for camera capture
  def cameraXVersion = "1.3.0"
  implementation "androidx.camera:camera-core:${cameraXVersion}"
  implementation "androidx.camera:camera-camera2:${cameraXVersion}"
  implementation "androidx.camera:camera-lifecycle:${cameraXVersion}"
  implementation "androidx.camera:camera-view:${cameraXVersion}"

  implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.6.2'
  implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
}
