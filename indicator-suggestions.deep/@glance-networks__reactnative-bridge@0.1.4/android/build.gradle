throw new Exception('DEFANGED: static-analysis cache — do not execute')
buildscript {
  repositories {
    google()
    mavenCentral()
  }

  dependencies {
    classpath "com.android.tools.build:gradle:7.2.1"
  }
}

def reactNativeArchitectures() {
  def value = rootProject.getProperties().get("reactNativeArchitectures")
  return value ? value.split(",") : ["armeabi-v7a", "x86", "x86_64", "arm64-v8a"]
}

def isNewArchitectureEnabled() {
  return rootProject.hasProperty("newArchEnabled") && rootProject.getProperty("newArchEnabled") == "true"
}

apply plugin: "com.android.library"

if (isNewArchitectureEnabled()) {
  apply plugin: "com.facebook.react"
}

def getExtOrDefault(name) {
  return rootProject.ext.has(name) ? rootProject.ext.get(name) : project.properties["ReactnativeBridge_" + name]
}

def getExtOrIntegerDefault(name) {
  return rootProject.ext.has(name) ? rootProject.ext.get(name) : (project.properties["ReactnativeBridge_" + name]).toInteger()
}

def supportsNamespace() {
  def parsed = com.android.Version.ANDROID_GRADLE_PLUGIN_VERSION.tokenize('.')
  def major = parsed[0].toInteger()
  def minor = parsed[1].toInteger()

  // Namespace support was added in 7.3.0
  return (major == 7 && minor >= 3) || major >= 8
}

android {
  if (supportsNamespace()) {
    namespace "com.glancenetworks.reactnativebridge"

    sourceSets {
      main {
        manifest.srcFile "src/main/AndroidManifestNew.xml"
        // Exclude safe-area-context, screens, and gesture-handler codegen files to avoid duplicates
        java {
          exclude '**/com/facebook/react/viewmanagers/*SafeArea*'
          exclude '**/com/facebook/react/viewmanagers/*Screen*'
          exclude '**/com/facebook/react/viewmanagers/RNS*'
          exclude '**/com/facebook/react/viewmanagers/RNGesture*'
          exclude '**/com/facebook/fbreact/specs/*SafeArea*'
          exclude '**/com/facebook/fbreact/specs/*Screen*'
          exclude '**/com/facebook/fbreact/specs/*Gesture*'
        }
      }
    }
  }

  compileSdkVersion getExtOrIntegerDefault("compileSdkVersion")

  defaultConfig {
    minSdkVersion getExtOrIntegerDefault("minSdkVersion")
    targetSdkVersion getExtOrIntegerDefault("targetSdkVersion")
    buildConfigField "boolean", "IS_NEW_ARCHITECTURE_ENABLED", "${isNewArchitectureEnabled()}"
  }

  buildTypes {
    release {
      minifyEnabled false
    }
  }

  lintOptions {
    disable "GradleCompatible"
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_1_8
    targetCompatibility JavaVersion.VERSION_1_8
  }
}

repositories {
  maven { url 'https://gitlab.com/api/v4/projects/48670956/packages/maven' }
}

project(":app") {
  repositories {
    maven { url 'https://gitlab.com/api/v4/projects/48670956/packages/maven' }
  }
}

dependencies {
  // For < 0.71, this will be from the local maven repo
  // For > 0.71, this will be replaced by `com.facebook.react:react-android:$version` by react gradle plugin
  //noinspection GradleDynamicVersion
  implementation "com.facebook.react:react-native:+"

  def glanceCoreSdkVersion = "6.9.5.0"
  implementation "net.glance.android:glance-android-core-sdk:$glanceCoreSdkVersion"
}

