// react-native-mesh-sdk :: Android Native SDK
//
// This module compiles TWO things together:
//   1. The thin wrapper in src/main/java/com/meshsdk/* (the Native SDK layer).
//   2. The Core BitChat sources copied VERBATIM into ./core by scripts/sync-core.sh
//      (the entire `com.bitchat.android` tree from bitchat-android/app).
//
// We mirror bitchat-android/app's dependency set so the copied core compiles
// unchanged. We do NOT modify any core file — updates are a pure re-copy.

// Plugins (AGP, Kotlin, Parcelize, Compose-compiler) are provided by the host
// app's root build.gradle classpath — do NOT declare a buildscript here, or the
// Kotlin/AGP versions would conflict with the app's. The app must put these on
// its root classpath (the example does):
//   com.android.tools.build:gradle, org.jetbrains.kotlin:kotlin-gradle-plugin,
//   org.jetbrains.kotlin:compose-compiler-gradle-plugin  (all Kotlin 2.0+).
def safeExtGet(prop, fallback) {
  rootProject.ext.has(prop) ? rootProject.ext.get(prop) : fallback
}

apply plugin: "com.android.library"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "org.jetbrains.kotlin.plugin.parcelize"
apply plugin: "org.jetbrains.kotlin.plugin.compose"

android {
  // Namespace MUST be com.bitchat.android so the vendored UI's `R` (resources
  // copied from bitchat-android) resolves. The wrapper classes live in the
  // com.meshsdk package — package != namespace, so that's unaffected.
  namespace "com.bitchat.android"
  compileSdk safeExtGet("compileSdkVersion", 35)

  defaultConfig {
    minSdkVersion safeExtGet("minSdkVersion", 26)
    targetSdkVersion safeExtGet("targetSdkVersion", 35)
    consumerProguardFiles "consumer-rules.pro"
  }

  buildFeatures {
    compose true
  }
  composeOptions {
    // Compose compiler is supplied by the kotlin compose plugin (Kotlin 2.x).
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }
  kotlinOptions {
    jvmTarget = "17"
    // Core BitChat is authored against Kotlin 2.2 stdlib, where these APIs are
    // stable; on the RN-compatible Kotlin 2.0.21 they still need opt-in. This is
    // a build flag, not a core edit.
    freeCompilerArgs += [
      "-opt-in=kotlin.ExperimentalStdlibApi",
      "-opt-in=kotlin.ExperimentalUnsignedTypes",
      "-opt-in=kotlinx.coroutines.ExperimentalCoroutinesApi",
      "-opt-in=kotlinx.coroutines.FlowPreview",
    ]
  }

  // The vendored Core BitChat is synced directly into src/main/java (next to the
  // com.meshsdk wrapper), so the default source set compiles its mixed Kotlin +
  // Java.

  packagingOptions {
    resources.excludes += [
      "META-INF/*.kotlin_module",
      "META-INF/DEPENDENCIES",
      "META-INF/LICENSE*",
    ]
  }

  lint {
    abortOnError false
  }
}

repositories {
  google()
  mavenCentral()
}

dependencies {
  // --- React Native ---
  implementation "com.facebook.react:react-android"

  // Vendored southernstorm Noise library, PRECOMPILED to a jar by sync-core.sh.
  // RNGP 0.74 caps Kotlin at 2.0.x, and Kotlin 2.0.x can't resolve this Java-only
  // subpackage from mixed sources (fixed in 2.1, but 2.1 breaks RNGP). Compiling
  // it to a classpath jar sidesteps the whole conflict on any Kotlin version.
  implementation fileTree(dir: "libs", include: ["*.jar"])

  // --- Core BitChat runtime dependencies (mirrors bitchat-android/app
  //     gradle/libs.versions.toml exactly, so the whole vendored app compiles) ---
  def composeBom = platform("androidx.compose:compose-bom:2025.06.01")
  implementation composeBom

  implementation "androidx.core:core-ktx:1.16.0"
  implementation "androidx.appcompat:appcompat:1.7.1"
  implementation "androidx.activity:activity-compose:1.10.1"

  // Compose
  implementation "androidx.compose.ui:ui"
  implementation "androidx.compose.ui:ui-graphics"
  implementation "androidx.compose.ui:ui-tooling-preview"
  implementation "androidx.compose.runtime:runtime"
  implementation "androidx.compose.material3:material3"
  implementation "androidx.compose.material:material-icons-extended"
  implementation "androidx.compose.foundation:foundation"
  debugImplementation "androidx.compose.ui:ui-tooling"

  // Lifecycle
  implementation "androidx.lifecycle:lifecycle-runtime-ktx:2.9.1"
  implementation "androidx.lifecycle:lifecycle-process:2.8.7"
  implementation "androidx.lifecycle:lifecycle-viewmodel-compose:2.9.1"

  // Navigation
  implementation "androidx.navigation:navigation-compose:2.9.1"

  // Permissions
  implementation "com.google.accompanist:accompanist-permissions:0.37.3"

  // Cryptography
  implementation "org.bouncycastle:bcprov-jdk15on:1.70"
  implementation "com.google.crypto.tink:tink-android:1.10.0"

  // JSON
  implementation "com.google.code.gson:gson:2.13.1"

  // Coroutines
  implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2"

  // Bluetooth (Nordic BLE library)
  implementation "no.nordicsemi.android:ble:2.6.1"

  // WebSocket (Nostr relays in core)
  implementation "com.squareup.okhttp3:okhttp:4.12.0"

  // Location (geohash channels in core)
  implementation "com.google.android.gms:play-services-location:21.3.0"

  // Encrypted preferences
  implementation "androidx.security:security-crypto:1.1.0-beta01"

  // QR + camera + barcode (QR verification / scanning UI in core)
  implementation "com.google.zxing:core:3.5.4"
  implementation "androidx.camera:camera-camera2:1.5.2"
  implementation "androidx.camera:camera-lifecycle:1.5.2"
  implementation "androidx.camera:camera-compose:1.5.2"
  implementation "com.google.mlkit:barcode-scanning:17.3.0"

  // EXIF
  implementation "androidx.exifinterface:exifinterface:1.3.7"
}
