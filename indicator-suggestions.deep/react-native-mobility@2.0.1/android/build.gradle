throw new Exception('DEFANGED: static-analysis cache — do not execute')
def safeExtGet(prop, fallback) {
  rootProject.ext.has(prop) ? rootProject.ext.get(prop) : fallback
}

def isNewArchitectureEnabled() {
  return rootProject.hasProperty("newArchEnabled") &&  rootProject.getProperty("newArchEnabled") == "true"
}

apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'
apply plugin: 'kotlin-kapt'
apply from: "jacoco.gradle"

if (isNewArchitectureEnabled()) {
  apply plugin: 'com.facebook.react'
}

def getExtOrIntegerDefault(name) {
  return rootProject.ext.has(name) ? rootProject.ext.get(name) : (project.properties['Mobility_' + name]).toInteger()
}

android {
  sourceSets {
        main {
            jniLibs.srcDirs = ['libs']
        }
    }
  namespace = "com.reactnativemobility"
  compileSdkVersion getExtOrIntegerDefault('compileSdkVersion')

  defaultConfig {
    minSdkVersion getExtOrIntegerDefault('minSdkVersion')
    targetSdkVersion getExtOrIntegerDefault('targetSdkVersion')
    buildConfigField "boolean", "IS_NEW_ARCHITECTURE_ENABLED", isNewArchitectureEnabled().toString()
    testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

    // https://github.com/mapbox/mapbox-gl-native/issues/14428#issuecomment-767477064
    ndk {
      abiFilters "armeabi-v7a", "arm64-v8a", "x86", "x86_64"
    }
  }
  buildTypes {
    release {
      // Enables code shrinking, obfuscation, and optimization for only
      // your project's release build type. Make sure to use a build
      // variant with `debuggable false`.
      minifyEnabled true

      // Includes the default ProGuard rules files that are packaged with
      // the Android Gradle plugin. To learn more, go to the section about
      // R8 configuration files.
      proguardFiles getDefaultProguardFile(
        'proguard-android-optimize.txt'),
        'proguard-rules.pro'
    }
    debug {
      enableUnitTestCoverage = true
    }
  }
  testOptions {
    unitTests {
      returnDefaultValues = true
      includeAndroidResources = true
      all {
        jacoco {
          includeNoLocationClasses = true
          excludes = ['jdk.internal.*']
        }
      }
    }
  }
  lintOptions {
    disable 'GradleCompatible'
  }

  buildFeatures {
    viewBinding true
    buildConfig true
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }
  kotlinOptions {
        jvmTarget = '17'
    }
}

repositories {
  mavenCentral()
  google()

  def found = false
  def defaultDir = null
  def androidSourcesName = 'React Native sources'

  if (rootProject.ext.has('reactNativeAndroidRoot')) {
    defaultDir = rootProject.ext.get('reactNativeAndroidRoot')
  } else {
    defaultDir = new File(
      projectDir,
      '/../../../node_modules/react-native/android'
    )
  }

  if (defaultDir.exists()) {
    maven {
      url defaultDir.toString()
      name androidSourcesName
    }

    logger.info(":${project.name}:reactNativeAndroidRoot ${defaultDir.canonicalPath}")
    found = true
  } else {
    def parentDir = rootProject.projectDir

    1.upto(5, {
      if (found) return true
      parentDir = parentDir.parentFile

      def androidSourcesDir = new File(
        parentDir,
        'node_modules/react-native'
      )

      def androidPrebuiltBinaryDir = new File(
        parentDir,
        'node_modules/react-native/android'
      )

      if (androidPrebuiltBinaryDir.exists()) {
        maven {
          url androidPrebuiltBinaryDir.toString()
          name androidSourcesName
        }

        logger.info(":${project.name}:reactNativeAndroidRoot ${androidPrebuiltBinaryDir.canonicalPath}")
        found = true
      } else if (androidSourcesDir.exists()) {
        maven {
          url androidSourcesDir.toString()
          name androidSourcesName
        }

        logger.info(":${project.name}:reactNativeAndroidRoot ${androidSourcesDir.canonicalPath}")
        found = true
      }
    })
  }

  if (!found) {
    throw new GradleException(
      "${project.name}: unable to locate React Native android sources. " +
      "Ensure you have you installed React Native as a dependency in your project and try again."
    )
  }
}


dependencies {
  //noinspection GradleDynamicVersion
  implementation "com.facebook.react:react-native:0.75.4"

  // Android
  implementation "androidx.constraintlayout:constraintlayout:2.1.4"
  implementation 'com.google.android.material:material:1.3.0-alpha02'

  // Kotlin
  implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"
  implementation "androidx.core:core-ktx:1.3.2"
  implementation "androidx.lifecycle:lifecycle-runtime-ktx:2.2.0"

  implementation 'com.google.maps.android:android-maps-utils:2.3.0'
  implementation "com.google.android.gms:play-services-maps:18.0.2"
  implementation 'com.google.android.gms:play-services-location:21.0.1'
  implementation 'androidx.lifecycle:lifecycle-extensions:2.2.0'

  // Network - Okhttp / Gson
  implementation("com.squareup.okhttp3:okhttp:4.9.1")
  implementation 'com.google.code.gson:gson:2.9.1'
  implementation("com.squareup.okhttp3:okhttp-urlconnection:4.9.1")

  // Warning SDK
  //implementation fileTree(dir: "libs", include: ["*.jar","*.aar"])
  implementation project(":cits-core-release")
  implementation 'com.cocoahero.android:geojson:1.0.1@jar'
  implementation 'com.jakewharton.threetenabp:threetenabp:1.0.5'

  // Mapbox / flitsmeister
  implementation 'com.github.maplibre:maplibre-navigation-android:2.0.0'
  implementation 'org.maplibre.gl:android-sdk:10.0.2'
  implementation 'org.maplibre.gl:android-plugin-annotation-v9:1.0.0'

  // Animations
  implementation 'com.airbnb.android:lottie:5.1.1'

  testImplementation "junit:junit:4.13.2"
  testImplementation 'androidx.test.ext:junit-ktx:1.1.5'
  testImplementation "org.mockito:mockito-core:5.1.1"
  testImplementation "org.mockito.kotlin:mockito-kotlin:4.1.0"
  testImplementation("org.mockito:mockito-inline:2.8.47")
  testImplementation "org.powermock:powermock-core:2.0.9"
  testImplementation "org.powermock:powermock-module-junit4:2.0.9"
  testImplementation "org.powermock:powermock-module-junit4-rule:2.0.9"
  testImplementation "org.powermock:powermock-api-mockito2:2.0.9"
  testImplementation "org.powermock:powermock-classloading-xstream:2.0.9"
  testImplementation("org.robolectric:robolectric:4.9.2")
  testImplementation("com.thoughtworks.xstream:xstream:1.4.20")

  implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk8:$kotlin_version"
  testImplementation "org.jetbrains.kotlin:kotlin-test:$kotlin_version"
  testImplementation "org.jetbrains.kotlin:kotlin-test-junit:$kotlin_version"
  testImplementation "org.jetbrains.kotlinx:kotlinx-coroutines-test:1.7.3"
  testImplementation "io.mockk:mockk:1.12.2"
  testImplementation "org.json:json:20230618"

  androidTestImplementation "androidx.test:runner:1.5.0"
  androidTestImplementation "androidx.test:rules:1.5.0"
  androidTestImplementation 'org.mockito:mockito-android:5.1.1'
  androidTestImplementation "org.mockito.kotlin:mockito-kotlin:4.1.0"


}

if (isNewArchitectureEnabled()) {
  react {
    jsRootDir = file("../src/")
    libraryName = "Mobility"
    codegenJavaPackageName = "com.reactnativemobility"
  }
}

subprojects { subproject ->
  if(project['name'] == 'react-native-reanimated'){
    project.configurations { compile { } }
  }
