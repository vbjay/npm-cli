buildscript {
  ext.getExtOrDefault = {name ->
    return rootProject.ext.has(name) ? rootProject.ext.get(name) : project.properties['IdwiseReactNativeSdk_' + name]
  }

  repositories {
    google()
    mavenCentral()
    maven { url 'https://mobile-sdk.idwise.ai/releases/' }
  }

  dependencies {
    classpath "com.android.tools.build:gradle:8.7.2"
    // noinspection DifferentKotlinGradleVersion
    classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:${getExtOrDefault('kotlinVersion')}"
  }
}


apply plugin: "com.android.library"
apply plugin: "kotlin-android"

apply plugin: "com.facebook.react"

def getExtOrIntegerDefault(name) {
  return rootProject.ext.has(name) ? rootProject.ext.get(name) : (project.properties["IdwiseReactNativeSdk_" + name]).toInteger()
}

android {
  namespace "com.idwisereactnativesdk"

  compileSdkVersion getExtOrIntegerDefault("compileSdkVersion")

  defaultConfig {
    minSdkVersion getExtOrIntegerDefault("minSdkVersion")
    targetSdkVersion getExtOrIntegerDefault("targetSdkVersion")
    multiDexEnabled true
  }

  buildFeatures {
    buildConfig true
    dataBinding true
  }

  buildTypes {
    release {
      minifyEnabled false
    }
  }

  lintOptions {
    disable "GradleCompatible"
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_1_8
    targetCompatibility JavaVersion.VERSION_1_8
  }

  sourceSets {
    main {
      java.srcDirs += [
        "generated/java",
        "generated/jni"
      ]
    }
  }
}

repositories {
  mavenCentral()
  google()

  maven { url 'https://mobile-sdk.idwise.ai/releases/' }
}

def kotlin_version = getExtOrDefault("kotlinVersion")
def idwise_sdk_version =project.properties["idwise_sdk_version"]

dependencies {
  implementation "com.facebook.react:react-android"
  implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"

  implementation "com.fasterxml.jackson.core:jackson-databind:2.17.0"
  implementation "com.idwise:android-sdk:$idwise_sdk_version"
  implementation "com.idwise:nfc:$idwise_sdk_version"
}

react {
  jsRootDir = file("../src/")
  libraryName = "IdwiseReactNativeSdk"
  codegenJavaPackageName = "com.idwisereactnativesdk"
}
