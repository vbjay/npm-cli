// DEFANGED: static-analysis cache — do not execute
throw new Exception('DEFANGED: static-analysis cache — do not execute')
apply plugin: 'com.android.library'

group = 'expo.modules.weavriopushprovisioningreactnative'
version = '0.1.0'

def expoModulesCorePlugin = new File(project(":expo-modules-core").projectDir.absolutePath, "ExpoModulesCorePlugin.gradle")
apply from: expoModulesCorePlugin
applyKotlinExpoModulesCorePlugin()
useCoreDependencies()
useExpoPublishing()



// Repositories are now configured centrally in settings.gradle
// This ensures all modules use the same repository configuration including GitHub Packages

// If you want to use the managed Android SDK versions from expo-modules-core, set this to true.
// The Android SDK versions will be bumped from time to time in SDK releases and may introduce breaking changes in your module code.
// Most of the time, you may like to manage the Android SDK versions yourself.
def useManagedAndroidSdkVersions = false
if (useManagedAndroidSdkVersions) {
  useDefaultAndroidSdkVersions()
} else {
  buildscript {
    // Simple helper that allows the root project to override versions declared by this library.
    ext.safeExtGet = { prop, fallback ->
      rootProject.ext.has(prop) ? rootProject.ext.get(prop) : fallback
    }
  }
}

// Define safeExtGet function for use in android block
ext.safeExtGet = { prop, fallback ->
  rootProject.ext.has(prop) ? rootProject.ext.get(prop) : fallback
}

android {
  namespace "expo.modules.weavriopushprovisioningreactnative"
  compileSdkVersion safeExtGet("compileSdkVersion", 36)
  buildToolsVersion safeExtGet("buildToolsVersion", "36.0.0")

  defaultConfig {
    versionCode 1
    versionName "0.1.0"
    minSdkVersion safeExtGet("minSdkVersion", 24)
    targetSdkVersion safeExtGet("targetSdkVersion", 36)
  }

  lintOptions {
    abortOnError false
  }

  // Enable Java 8+ features
  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
    coreLibraryDesugaringEnabled true
  }

  kotlinOptions {
    jvmTarget = '17'
  }

  // Enable ProGuard for release builds
  buildTypes {
    release {
      minifyEnabled true
      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
    }
  }
}

dependencies {
  // Kotlin standard library
  implementation "org.jetbrains.kotlin:kotlin-stdlib:1.9.24"

  // Image loading library
  implementation 'com.github.bumptech.glide:glide:4.12.0'

  // JSON parsing
  implementation 'com.google.code.gson:gson:2.8.9'

  // HTTP client
  implementation 'com.squareup.retrofit2:retrofit:2.9.0'
  implementation 'com.squareup.retrofit2:converter-gson:2.9.0'

  // Weavr Push Provisioning SDK from GitHub Packages
  // This includes Phyre and MeaWallet as transitive dependencies
  implementation 'io.weavr.push-provisioning:push-provisioning:2.1.1'

  // Build Tools - Java 8+ desugaring support
  coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'

  // Android dependencies
  implementation 'androidx.fragment:fragment-ktx:1.6.2'
  implementation 'androidx.appcompat:appcompat:1.6.1'

  // Glide to load the image for add to wallet button
  implementation 'com.github.bumptech.glide:glide:5.0.5'

  // Keep existing Expo dependencies
  implementation project(':expo-modules-core')
}
