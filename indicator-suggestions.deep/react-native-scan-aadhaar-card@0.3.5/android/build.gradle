// =============================================================================
// android/build.gradle
//
// Source-mode Android library — compiled on the consumer app's Gradle build.
// iOS is distributed as a prebuilt XCFramework; Android ships Kotlin source
// for reliable autolinking and dependency resolution across RN/AGP versions.
// =============================================================================

buildscript {
  ext.getExtOrDefault = { name ->
    return rootProject.ext.has(name) ? rootProject.ext.get(name) : project.properties["ScanAadhaarCard_" + name]
  }

  repositories {
    google()
    mavenCentral()
  }

  dependencies {
    // Unpinned — resolves from the consumer app's AGP (8.6+).
    classpath "com.android.tools.build:gradle"
    // Prefers rootProject.ext.kotlinVersion (consumer 1.9.x), falls back to gradle.properties.
    classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:${getExtOrDefault('kotlinVersion')}"
  }
}

def isNewArchitectureEnabled() {
  return rootProject.hasProperty("newArchEnabled") && rootProject.getProperty("newArchEnabled") == "true"
}

def getExtOrIntegerDefault(name) {
  return rootProject.ext.has(name) ? rootProject.ext.get(name) : (project.properties["ScanAadhaarCard_" + name]).toInteger()
}

def supportsNamespace() {
  def parsed = com.android.Version.ANDROID_GRADLE_PLUGIN_VERSION.tokenize('.')
  def major = parsed[0].toInteger()
  def minor = parsed[1].toInteger()
  // Namespace support was added in AGP 7.3.0
  return (major == 7 && minor >= 3) || major >= 8
}

apply plugin: "com.android.library"
apply plugin: "kotlin-android"
apply plugin: "kotlin-parcelize"

if (isNewArchitectureEnabled()) {
  apply plugin: "com.facebook.react"
}

android {
  if (supportsNamespace()) {
    namespace "com.scanaadhaarcard"
  }

  compileSdkVersion getExtOrIntegerDefault("compileSdkVersion")

  defaultConfig {
    minSdkVersion getExtOrIntegerDefault("minSdkVersion")
    targetSdkVersion getExtOrIntegerDefault("targetSdkVersion")
    buildConfigField "boolean", "IS_NEW_ARCHITECTURE_ENABLED", isNewArchitectureEnabled().toString()
  }

  buildFeatures {
    buildConfig true
    viewBinding true
  }

  buildTypes {
    release {
      minifyEnabled false
    }
  }

  lintOptions {
    disable "GradleCompatible"
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }

  sourceSets {
    main {
      if (supportsNamespace()) {
        manifest.srcFile "src/main/AndroidManifestNew.xml"
      }
      if (isNewArchitectureEnabled()) {
        java.srcDirs += ["src/newarch"]
      } else {
        java.srcDirs += ["src/oldarch"]
      }
    }
  }
}

repositories {
  google()
  mavenCentral()
}

dependencies {
  implementation "com.facebook.react:react-android"
  implementation "androidx.core:core-ktx:1.13.1"
  implementation "androidx.appcompat:appcompat:1.7.0"
  implementation "androidx.constraintlayout:constraintlayout:2.1.4"
  implementation "androidx.exifinterface:exifinterface:1.3.7"
  implementation "androidx.camera:camera-core:1.4.2"
  implementation "androidx.camera:camera-camera2:1.4.2"
  implementation "androidx.camera:camera-lifecycle:1.4.2"
  implementation "androidx.camera:camera-view:1.4.2"
  implementation "com.google.mlkit:barcode-scanning:17.3.0"
  implementation "io.github.zxing-cpp:android:2.3.0"
  implementation "com.google.guava:guava:33.4.8-android"
}
