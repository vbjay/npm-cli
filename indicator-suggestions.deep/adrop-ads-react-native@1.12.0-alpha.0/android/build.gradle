// DEFANGED: static-analysis cache — do not execute
throw new Exception('DEFANGED: static-analysis cache — do not execute')
def isNewArchitectureEnabled() {
    return rootProject.hasProperty("newArchEnabled") && rootProject.getProperty("newArchEnabled") == "true"
}

apply plugin: "com.android.library"

if (isNewArchitectureEnabled()) {
    apply plugin: "com.facebook.react"
}

apply plugin: "kotlin-android"

def getExtOrDefault(name) {
    return rootProject.ext.has(name) ? rootProject.ext.get(name) : project.properties["AdropAdsReactNative_" + name]
}

def getExtOrIntegerDefault(name) {
    return rootProject.ext.has(name) ? rootProject.ext.get(name) : (project.properties["AdropAdsReactNative_" + name]).toInteger()
}

def supportsNamespace() {
    def parsed = com.android.Version.ANDROID_GRADLE_PLUGIN_VERSION.tokenize('.')
    def major = parsed[0].toInteger()
    def minor = parsed[1].toInteger()

    // Namespace support was added in 7.3.0
    return (major == 7 && minor >= 3) || major >= 8
}


android {
    if (supportsNamespace()) {
        namespace "io.adrop"

        sourceSets {
            main {
                manifest.srcFile "src/main/AndroidManifestNew.xml"
            }
        }
    }

    // New Architecture dual-arch source sets.
    // - newarch: each `<Module>Spec` base extends the codegen-generated
    //   `Native*Spec` (TurboModule) → real TurboModules under New Architecture.
    // - oldarch: each `<Module>Spec` base extends `ReactContextBaseJavaModule`
    //   → classic bridge modules. Old Architecture is preserved unchanged.
    // Concrete modules in src/main extend `<Module>Spec`, resolved to whichever
    // base the active build variant compiles.
    sourceSets {
        main {
            if (isNewArchitectureEnabled()) {
                java.srcDirs += ["src/newarch/java"]
            } else {
                java.srcDirs += ["src/oldarch/java"]
            }
        }
    }

    compileSdkVersion getExtOrIntegerDefault("compileSdkVersion")

    defaultConfig {
        minSdkVersion getExtOrIntegerDefault("minSdkVersion")
        targetSdkVersion getExtOrIntegerDefault("targetSdkVersion")
        multiDexEnabled true
        buildConfigField "boolean", "IS_NEW_ARCHITECTURE_ENABLED", isNewArchitectureEnabled().toString()
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    lintOptions {
        disable "GradleCompatible"
    }

    // Detect the React Native minor version (used for the minimum-version guard + JVM target).
    def reactNativeVersion = 0
    try {
        def jsonSlurper = new groovy.json.JsonSlurper()
        def possiblePackageJsonFiles = [
            new File(rootProject.projectDir, "../node_modules/react-native/package.json"),
            new File(rootProject.projectDir, "node_modules/react-native/package.json"),
            new File(rootDir, "node_modules/react-native/package.json")
        ]
        def packageJsonFile = possiblePackageJsonFiles.find { it.exists() }
        if (packageJsonFile != null) {
            def packageJson = jsonSlurper.parseText(packageJsonFile.text)
            def versionParts = packageJson.version.split("\\.")
            if (versionParts.length >= 2) {
                reactNativeVersion = versionParts[1].replaceAll("[^0-9]", "").toInteger()
            }
        } else {
            println "[AdropAds] Warning: react-native package.json not found, defaulting to JVM 11"
        }
    } catch (Exception e) {
        println "[AdropAds] Warning: Could not detect React Native version, defaulting to JVM 11"
    }

    // adrop-ads-react-native depends on BaseReactPackage (added in RN 0.74) and the
    // 6-arg ReactModuleInfo, so RN < 0.74 cannot compile at all. Fail clearly here
    // instead of with the obscure late-build "unresolved reference: BaseReactPackage".
    // (reactNativeVersion == 0 = detection failed -> skip the guard.)
    if (reactNativeVersion > 0 && reactNativeVersion < 74) {
        throw new GradleException(
            "adrop-ads-react-native requires React Native >= 0.74 " +
            "(detected 0.${reactNativeVersion}). For RN < 0.74, use an earlier SDK version."
        )
    }

    // RN 0.73+ requires Java/Kotlin target 17 (older RN used 11). Must match the
    // app's Java target or Gradle fails with "Inconsistent JVM-target".
    def javaVersion = reactNativeVersion >= 73 ? JavaVersion.VERSION_17 : JavaVersion.VERSION_11

    compileOptions {
        sourceCompatibility javaVersion
        targetCompatibility javaVersion
    }

    kotlinOptions {
        jvmTarget = javaVersion.majorVersion
    }
}

def kotlin_version = getExtOrDefault("kotlinVersion")

dependencies {
    implementation "com.facebook.react:react-android"
    implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"

    implementation "io.adrop:adrop-ads:[1.11, 1.12)"
}

