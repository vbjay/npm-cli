buildscript {
    ext {
        gradle_version = '8.3.2'
        constraint_layout_version = '1.1.3'
        caf_bridges_bom_version = '7.14.0-rc.3'
    }

    def kotlin_version = rootProject.ext.has("kotlinVersion") ? rootProject.ext.get("kotlinVersion") : project.properties["RNCafFaceLiveness_kotlinVersion"]

    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath "com.android.tools.build:gradle:$gradle_version"
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

def isNewArchitectureEnabled() {
    return rootProject.hasProperty("newArchEnabled") && rootProject.getProperty("newArchEnabled") == "true"
}

apply plugin: "com.android.library"
apply plugin: "kotlin-android"

def appProject = rootProject.allprojects.find { it.plugins.hasPlugin('com.android.application') }

if (isNewArchitectureEnabled()) {
    apply plugin: "com.facebook.react"
}

def getExtOrDefault(name) {
    return rootProject.ext.has(name) ? rootProject.ext.get(name) : project.properties["RNCafFaceLiveness_" + name]
}

def getExtOrIntegerDefault(name) {
    return rootProject.ext.has(name) ? rootProject.ext.get(name) : (project.properties["RNCafFaceLiveness_" + name]).toInteger()
}

// Load Caf Modules Configuration
def loadCafModulesConfig() {
    // App root (RN / Expo prebuild): sibling of android/. Also allow android/caf-modules-config.json.
    def candidates = [
        new File(project.rootProject.projectDir.parentFile, 'caf-modules-config.json'),
        new File(project.rootProject.projectDir, 'caf-modules-config.json'),
    ]
    def configFile = candidates.find { it.exists() }
        
    println "\033[32mCaf Modules Configuration started\033[0m"
        
    if (configFile != null) {
        def config = new groovy.json.JsonSlurper().parse(configFile)
        return config
    } else {
        // If the file does not exist, use the default configuration
        println "\033[33mNo Caf Modules Configuration file found\033[0m"
        println "\033[33mUsing default configuration (all modules enabled)\033[0m"
        println "\033[36mTo customize modules, create caf-modules-config.json in the project root with:\033[0m"
        println "\033[36m{\033[0m"
        println "\033[36m  \"documentDetector\": false,\033[0m"
        println "\033[36m  \"faceLiveness\": false,\033[0m"
        println "\033[36m  \"documentDetectorUI\": false,\033[0m"
        println "\033[36m  \"faceLivenessUI\": false,\033[0m"
        println "\033[36m  \"livenessProviders\": [\"iproov-lite\", \"payface\"]\033[0m"
        println "\033[36m}\033[0m"
        println "\033[36mSet to false to disable a module, true to enable\033[0m"
        println "\033[36mSee https://docs.caf.io/caf-sdk/react-native/getting-started-with-the-sdk for more information.\033[0m"
    }
        
    return [:]
}

def LIVENESS_PROVIDER_MAP = [
    "iproov-lite" : "io.caf.sdk:caffaceliveness-providers-iproov-lite",
    "iproov-full" : "io.caf.sdk:caffaceliveness-providers-iproov-full",
    "payface"     : "io.caf.sdk:caffaceliveness-providers-payface",
    "facetec"     : "io.caf.sdk:caffaceliveness-providers-facetec",
]

def DEFAULT_LIVENESS_PROVIDERS = ["iproov-lite"]

def resolveLivenessProviderDependencies(modules, providerMap, defaultProviders) {
   
    def rawValue = modules?.livenessProviders ?: modules?.livenessProvider

    if (rawValue == null) {
        println "\033[33mNo livenessProvider(s) specified, using default: ${defaultProviders}\033[0m"
        return defaultProviders.collect { providerMap[it] }
    }

    def requested = (rawValue instanceof List) ? rawValue*.toString() : [rawValue as String]

    if (requested.isEmpty() || requested.every { it.trim().isEmpty() }) {
        println "\033[33mWarning: livenessProviders is explicitly empty, falling back to default: ${defaultProviders}\033[0m"
        return defaultProviders.collect { providerMap[it] }
    }

    
    requested.each { provider ->
        if (!providerMap.containsKey(provider)) {
            throw new GradleException(
                "Invalid livenessProvider '${provider}'. Valid options are: ${providerMap.keySet().join(', ')}"
            )
        }
    }

    if (requested.contains("iproov-lite") && requested.contains("iproov-full")) {
        throw new GradleException(
            "'iproov-lite' and 'iproov-full' cannot be used together: " +
            "iproov-lite uses Protobuf Lite and iproov-full uses Protobuf Java. Choose one."
        )
    }

    println "\033[32mUsing liveness providers: ${requested.join(', ')}\033[0m"
    return requested.collect { providerMap[it] }
}


// Load Caf Modules Configuration
def cafModules = loadCafModulesConfig()


def livenessModuleEnabled = cafModules.faceLiveness || cafModules.faceLivenessUI || cafModules.isEmpty()
def resolvedLivenessProviderDeps = livenessModuleEnabled
    ? resolveLivenessProviderDependencies(cafModules, LIVENESS_PROVIDER_MAP, DEFAULT_LIVENESS_PROVIDERS)
    : []
android {
    namespace "io.caf.sdk.reactnative"

    compileSdkVersion getExtOrIntegerDefault("compileSdkVersion")

    defaultConfig {
        minSdkVersion getExtOrIntegerDefault("minSdkVersion")
        targetSdkVersion getExtOrIntegerDefault("targetSdkVersion")

        // Build Config Fields
        if (cafModules.documentDetector) {
            buildConfigField "boolean", "ENABLE_DOCUMENT_DETECTOR", "true"
        }

        if (cafModules.faceLiveness) {
            buildConfigField "boolean", "ENABLE_FACE_LIVENESS", "true"
        }

        if (cafModules.documentDetectorUI) {
            buildConfigField "boolean", "ENABLE_DOCUMENT_DETECTOR_UI", "true"
        }

        if (cafModules.faceLivenessUI) {
            buildConfigField "boolean", "ENABLE_FACE_LIVENESS_UI", "true"
        }

        // If the file does not exist, use the default configuration
        if (cafModules.isEmpty()) {
            buildConfigField "boolean", "ENABLE_DOCUMENT_DETECTOR", "true"
            buildConfigField "boolean", "ENABLE_FACE_LIVENESS", "true"
            buildConfigField "boolean", "ENABLE_DOCUMENT_DETECTOR_UI", "true"
            buildConfigField "boolean", "ENABLE_FACE_LIVENESS_UI", "true"
        }
    }

    buildFeatures {
        buildConfig true
    }

    lintOptions {
        disable "GradleCompatible"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    sourceSets {
        main {
            java.srcDirs += 'src/main/java'

            // Source Sets for each module
            if (cafModules.documentDetector) {
                java.srcDirs += 'src/main/java-documentdetector'
            }

            if (cafModules.faceLiveness) {
                java.srcDirs += 'src/main/java-caffaceliveness'
            }

            if (cafModules.documentDetectorUI) {
                java.srcDirs += 'src/main/java-documentdetectorui'
            }

            if (cafModules.faceLivenessUI) {
                java.srcDirs += 'src/main/java-caffacelivenessui'
            }

            // If the file does not exist, use the default configuration
            if (cafModules.isEmpty()) {
                java.srcDirs += 'src/main/java-documentdetector'
                java.srcDirs += 'src/main/java-caffaceliveness'
                java.srcDirs += 'src/main/java-documentdetectorui'
                java.srcDirs += 'src/main/java-caffacelivenessui'
            }
        }
    }

    rootProject.allprojects {
        repositories {
            mavenLocal()
            maven {
                url = uri("https://repo.combateafraude.com/android/release")
            }
        }
    }
}
repositories {
    mavenCentral()
    google()
}

def kotlin_version = getExtOrDefault("kotlinVersion")

dependencies {
    // For < 0.71, this will be from the local maven repo
    // For > 0.71, this will be replaced by `com.facebook.react:react-android:$version` by react gradle plugin
    //noinspection GradleDynamicVersion
    implementation("com.facebook.react:react-native:+")
    implementation("org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version")
    implementation("androidx.constraintlayout:constraintlayout:$constraint_layout_version")
    
    // Base dependency
    implementation(platform("io.caf.sdk:caf-sdk-bridges-bom:$caf_bridges_bom_version"))
    implementation("io.caf.sdk:caf-sdk-commons-bridge")

    // Conditional dependencies based on the Caf Modules Configuration
    if (cafModules.documentDetector) {
        println "\033[32mEnabling Document Detector module\033[0m"
        implementation("io.caf.sdk:documentdetector-bridge")
    }

    if (cafModules.faceLiveness) {
        println "\033[32mEnabling Face Liveness module\033[0m"
        implementation("io.caf.sdk:caffaceliveness-bridge")
        resolvedLivenessProviderDeps.each { implementation(it) }
    }
    
    if (cafModules.documentDetectorUI) {
        println "\033[32mEnabling Document Detector UI module\033[0m"
        implementation("io.caf.sdk:documentdetector-ui-bridge")
    }

    if (cafModules.faceLivenessUI) {
        println "\033[32mEnabling Face Liveness UI module\033[0m"
        implementation("io.caf.sdk:caffaceliveness-ui-bridge")
        if (!cafModules.faceLiveness) {
            resolvedLivenessProviderDeps.each { implementation(it) }
        }
    }

    // If the file does not exist, use the default configuration
    if (cafModules.isEmpty()) {
        implementation("io.caf.sdk:documentdetector-bridge")
        implementation("io.caf.sdk:caffaceliveness-bridge")
        resolvedLivenessProviderDeps.each { implementation(it) }
        implementation("io.caf.sdk:documentdetector-ui-bridge")
        implementation("io.caf.sdk:caffaceliveness-ui-bridge")
    }
}
