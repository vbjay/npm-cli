[package]
name = "rust-nodejs-lib"
version = "0.1.0"
description = "a simple js lib written in rust"
authors = ["Esau Martinez <esaumtz4722@gmail.com>"]
license = "MIT"
edition = "2018"
exclude = ["index.node"]

[lib]
crate-type = ["cdylib"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
num_cpus = "1.16.0"

[dependencies.neon]
version = "0.10"
default-features = false
features = ["napi-6"]
