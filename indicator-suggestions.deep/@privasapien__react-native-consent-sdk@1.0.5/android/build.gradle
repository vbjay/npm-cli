// ---------------------------------------------------------------------------
// Self-contained plugin resolution — consumers do NOT need to add anything
// to their own build.gradle or settings.gradle for this SDK to compile.
// ---------------------------------------------------------------------------
buildscript {
    def kotlinVer = rootProject.hasProperty('kotlinVersion')
            ? rootProject.ext.kotlinVersion
            : '2.0.21'
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
    dependencies {
        classpath "org.jetbrains.kotlin:compose-compiler-gradle-plugin:$kotlinVer"
    }
}

apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'
apply plugin: 'org.jetbrains.kotlin.plugin.compose'

android {
    namespace 'com.privasapien.consentsdk'
    compileSdk 36

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    sourceSets {
        main {
            java.srcDirs = ['src/main/kotlin']
        }
    }

    defaultConfig {
        minSdk 24
    }

    buildFeatures {
        compose true
    }
}

repositories {
    google()
    mavenCentral()
    maven { url 'https://s01.oss.sonatype.org/content/repositories/releases/' }
}

dependencies {
    // React Native runtime (provided by the host app — compileOnly avoids duplication)
    compileOnly 'com.facebook.react:react-android'

    // Privasapien native Android Consent SDK from Maven Central
    implementation 'com.privasapien:consent-sdk:1.0.1'

    // Jetpack Compose for ConsentActivity
    implementation 'androidx.activity:activity-compose:1.9.3'
    implementation platform('androidx.compose:compose-bom:2024.12.01')
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.ui:ui'
}
