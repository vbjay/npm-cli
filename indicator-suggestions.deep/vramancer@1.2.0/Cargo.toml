[package]
name = "vramancer"
version = "1.0.0"
edition = "2021"
description = "Can my machine run this model? Estimate VRAM/RAM, tok/s, and TTFT."
authors = ["Jules"]
license = "MIT"
repository = "https://github.com/09Catho/VRAMancer"
readme = "README.md"

[dependencies]
clap = { version = "4.4", features = ["derive"] }
ratatui = "0.26"
crossterm = "0.27"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sysinfo = "0.30"
regex = "1.10"
anyhow = "1.0"
thiserror = "1.0"
unicode-width = "0.1"
fuzzy-matcher = "0.3"
tokio = { version = "1.36", features = ["full"] }
reqwest = { version = "0.11", features = ["json", "blocking"] }
directories = "5.0" # useful for config/cache if needed, though not explicitly asked, good for finding home dir for ollama
open = "5.1" # useful for opening links if we add that, but maybe not needed strictly.

[profile.release]
strip = true
opt-level = "z"
lto = true
