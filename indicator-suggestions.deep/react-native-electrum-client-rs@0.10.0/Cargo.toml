[package]
name = "react-native-electrum-client-rs"
version = "0.10.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "staticlib"]
name = "electrum_client_rs"

[dependencies]
jni = "0.21"
rustls = "0.21"
rustls-native-certs = "0.6"
webpki-roots = "0.25"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
lazy_static = "1.5"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
