throw new Exception('DEFANGED: static-analysis cache — do not execute')
buildscript {
  repositories {
    google()
    mavenCentral()
    maven {
      url "https://europe-west1-maven.pkg.dev/mavenrepo-433814/scatecoresdk-android"
    }
  }

  dependencies {
    classpath "com.android.tools.build:gradle:7.2.1"
  }
}

def isNewArchitectureEnabled() {
  return rootProject.hasProperty("newArchEnabled") && rootProject.getProperty("newArchEnabled") == "true"
}

apply plugin: "com.android.library"

if (isNewArchitectureEnabled()) {
  apply plugin: "com.facebook.react"
}

def getExtOrDefault(name) {
  return rootProject.ext.has(name) ? rootProject.ext.get(name) : project.properties["ScatesdkReact_" + name]
}

def getExtOrIntegerDefault(name) {
  return rootProject.ext.has(name) ? rootProject.ext.get(name) : (project.properties["ScatesdkReact_" + name]).toInteger()
}

def reactPackageJson = new groovy.json.JsonSlurper().parseText(
  file("${projectDir}/../package.json").text
)
def reactSdkVersion = reactPackageJson.version.toString()

def supportsNamespace() {
  def parsed = com.android.Version.ANDROID_GRADLE_PLUGIN_VERSION.tokenize('.')
  def major = parsed[0].toInteger()
  def minor = parsed[1].toInteger()

  // Namespace support was added in 7.3.0
  return (major == 7 && minor >= 3) || major >= 8
}

android {
  if (supportsNamespace()) {
    namespace "com.scatesdkreact"

    sourceSets {
      main {
        manifest.srcFile "src/main/AndroidManifestNew.xml"
      }
    }
  }

  compileSdkVersion getExtOrIntegerDefault("compileSdkVersion")

  buildFeatures {
    buildConfig true
  }

  defaultConfig {
    minSdkVersion getExtOrIntegerDefault("minSdkVersion")
    targetSdkVersion getExtOrIntegerDefault("targetSdkVersion")
    buildConfigField "String", "INTEGRATION", "\"react-native\""
    buildConfigField "String", "INTEGRATION_SDK_VERSION", "\"7.0.10\""
    buildConfigField "String", "REACT_SDK_VERSION", "\"${reactSdkVersion}\""
  }

  buildTypes {
    release {
      minifyEnabled false
    }
  }

  lintOptions {
    disable "GradleCompatible"
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_1_8
    targetCompatibility JavaVersion.VERSION_1_8
  }
}

repositories {
  mavenCentral()
  google()
  maven {
    url "https://europe-west1-maven.pkg.dev/mavenrepo-433814/scatecoresdk-android"
  }
}


dependencies {
  // For < 0.71, this will be from the local maven repo
  // For > 0.71, this will be replaced by `com.facebook.react:react-android:$version` by react gradle plugin
  //noinspection GradleDynamicVersion
  implementation "com.facebook.react:react-native:+"
  implementation 'com.scate:scatesdk:7.0.10'
  implementation 'com.adjust.sdk:adjust-android:5.6.0'
  implementation 'com.android.installreferrer:installreferrer:2.2'
}
